# Model roles. The agent code only ever refers to ROLES, never model names.
# Switching providers for production = editing this file (LiteLLM naming: provider/model).
# Verify names against https://console.groq.com/docs/models, catalogs change.
models:
  orchestrator: groq/openai/gpt-oss-120b
  fast: groq/openai/gpt-oss-20b
  vision: groq/meta-llama/llama-4-maverick-17b-128e-instruct
  stt: groq/whisper-large-v3-turbo
  # embedding: decided at the RAG phase (Groq has no embedding model)

# Only sent when set. gpt-oss accepts low | medium | high.
reasoning_effort:
  orchestrator: low
