[project]
name = "zibi-backend"
version = "0.1.0"
description = "Zibi personal assistant: agent backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "pyyaml>=6",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["zibi*"]
